server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Handle React routing by redirecting all requests to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Handle standard 50x errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
